; PlatformIO-конфигурация проекта (основной способ сборки для пользователя).
;
;   pio run                 - собрать
;   pio run -t upload       - прошить (порт/скорость ниже)
;   pio device monitor      - смотреть лог (115200)
;
; Внимание: перед сборкой скрипт tools/pio_embed_web.py пересобирает
; src/page_html.h из web/index.html, поэтому правки интерфейса подхватываются
; автоматически.

[env:nodemcuv2]
platform = espressif8266@~4.2.0
board = nodemcuv2
framework = arduino

; --- прошивка ---
upload_speed = 921600
upload_port = COM7
monitor_speed = 115200
monitor_port = COM7
monitor_filters = esp8266_exception_decoder, time

; --- flash ---
board_build.flash_mode = dout
; Та же раскладка, что у выпускаемого firmware/autowatering-esp8266.bin:
; первые 1 МБ - прошивка, дальше раздел данных. От этого зависит и обновление
; по Wi-Fi (новый образ пишется в свободное место до раздела данных), и адрес
; хранения настроек в EEPROM - не меняйте, иначе настройки "потеряются".
board_build.ldscript = eagle.flash.4m.ld

; --- сборка ---
build_unflags = -fno-exceptions
extra_scripts = pre:tools/pio_embed_web.py
